name: Controllo compilazione

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila (versione F-Droid, non firmata)
        run: ./gradlew assembleFdroidRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NAS-Sync-fdroid-unsigned
          path: app/build/outputs/apk/fdroid/release/*.apk

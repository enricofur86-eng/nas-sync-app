name: Compila e pubblica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NASSYNC_PASSPHRASE: ${{ secrets.NASSYNC_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepara la chiave di firma (solo se il segreto c'e')
        if: env.NASSYNC_PASSPHRASE != ''
        run: |
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$NASSYNC_PASSPHRASE" \
            -d signing/nassync-release.jks.asc > "$RUNNER_TEMP/release.jks"
          echo "NASSYNC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "NASSYNC_KEYSTORE_PASSWORD=$NASSYNC_PASSPHRASE" >> "$GITHUB_ENV"
          echo "NASSYNC_KEY_ALIAS=nassync" >> "$GITHUB_ENV"
          echo "NASSYNC_KEY_PASSWORD=$NASSYNC_PASSPHRASE" >> "$GITHUB_ENV"

      - name: Compila (versione F-Droid / pubblica)
        run: ./gradlew assembleFdroidRelease --no-daemon --stacktrace

      - name: Rinomina APK
        id: apk
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          C=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          if [ -n "$NASSYNC_PASSPHRASE" ]; then
            cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "NAS-Sync-$V.apk"
          else
            cp app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk "NAS-Sync-$V-unsigned.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: NAS-Sync-${{ steps.apk.outputs.version }}
          path: NAS-Sync-*.apk

      - name: Crea il tag della versione (se manca)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          V=${{ steps.apk.outputs.version }}
          git fetch --tags --quiet
          if ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            git tag "v$V"
            git push origin "v$V"
          fi

      - name: Pubblica la release con l'APK firmato (se manca)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.NASSYNC_PASSPHRASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.apk.outputs.version }}
          C=${{ steps.apk.outputs.code }}
          if ! gh release view "v$V" >/dev/null 2>&1; then
            NOTES=fastlane/metadata/android/it-IT/changelogs/$C.txt
            [ -f "$NOTES" ] || NOTES=/dev/null
            gh release create "v$V" "NAS-Sync-$V.apk" --title "NAS Sync $V" --notes-file "$NOTES"
          fi

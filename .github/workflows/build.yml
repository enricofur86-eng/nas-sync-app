name: Controllo compilazione

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila (versione F-Droid, non firmata)
        run: ./gradlew assembleFdroidRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NAS-Sync-fdroid-unsigned
          path: app/build/outputs/apk/fdroid/release/*.apk
      - name: Crea il tag della versione (se manca)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          git fetch --tags --quiet
          if ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            git tag "v$V"
            git push origin "v$V"
          fi
